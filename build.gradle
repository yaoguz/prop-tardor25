plugins {
    id 'java'
    id 'application'
}

group = 'prop'
version = '3.0-SNAPSHOT'

application {
    mainClass = 'Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'presentation.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    destinationDirectory.set(file("EXE"))
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            exclude 'src/test_old/**'
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

task runDriverEncuesta(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'drivers.DriverEncuesta'
    standardInput = System.in
}

task runDriverPregunta(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'drivers.DriverPregunta'
    standardInput = System.in
}

task runDriverRespuesta(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'drivers.DriverRespuesta'
    standardInput = System.in
}

task runDriverUsuario(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'drivers.DriverUsuario'
    standardInput = System.in
}

task runDriverClustering(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'drivers.DriverClustering'
    standardInput = System.in
}

// Ejecuta la capa de presentación (GUI)
task runAll(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'presentation.Main'
    standardInput = System.in
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // Testing dependencies - JUnit 4 y Mockito
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
    testImplementation 'org.mockito:mockito-core:4.9.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.12.16'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.12.16'
    testImplementation 'org.objenesis:objenesis:3.3'
}
